[project]
name = "val2026"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["val2026", "scripts"]
